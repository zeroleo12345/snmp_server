version: '3.7'


x-logging:
  &default_logging
  driver: "json-file"
  options:
    max-size: "10m"


# Simple Network Management Protocol 消息通过UDP端口161接收，只有Trap信息用UDP端口162
services:
  alert:
    platform: linux/amd64
    container_name: snmp_trap_alert_server
    build:
       context: .
       dockerfile: ./Dockerfile
    image: snmp_collector:2.0.0
    ports:
      - "162:162/udp"
    environment:
      ENTRYPOINT: "${ENTRYPOINT:-/app/bin/snmp_trap_alert_server.sh}"
      SNMP_PORT: 162
    volumes:
      - .:/app
      - ./mibs/:/root/.pysnmp/mibs/
    entrypoint: sh -c 'if [ -z "$$ENTRYPOINT" ]; then echo "ENTRYPOINT is empty!"; exit 0; fi; exec $$ENTRYPOINT'
    restart: "${RESTART_POLICY:-on-failure}"
    logging: *default_logging

  scraper:
    platform: linux/amd64
    container_name: snmp_server_to_agent
    build:
       context: .
       dockerfile: ./Dockerfile
    image: snmp_collector:2.0.0
    environment:
      ENTRYPOINT: "${ENTRYPOINT:-/app/bin/scrape_from_agent.sh}"
    volumes:
      - .:/app
    entrypoint: sh -c 'if [ -z "$$ENTRYPOINT" ]; then echo "ENTRYPOINT is empty!"; exit 0; fi; exec $$ENTRYPOINT'
    restart: "${RESTART_POLICY:-on-failure}"
    logging: *default_logging
    networks:
      - pppoe_system


networks:
  pppoe_system:
    name: pppoe_system_network_name
